worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  65;
    keepalive_requests 1000;

    # Disable request body limits (not needed — all endpoints are GET).
    client_max_body_size 0;

    # Gzip text responses only (video segments are already compressed).
    gzip on;
    gzip_types application/json text/html text/css application/javascript;
    gzip_min_length 256;

    # Open file cache — avoids repeated stat() / open() for hot .ts segments.
    open_file_cache          max=10000 inactive=120s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    # Rate-limit zone: 10 req/s per IP for API endpoints.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream app {
        server app:8000;
        keepalive 32;
    }

    upstream mediamtx {
        server mediamtx:8888;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ---------- Live HLS from MediaMTX (real-time, not VOD) ----------
        location /live/ {
            proxy_pass http://mediamtx:8888/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_read_timeout 3600s;

            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff;
        }

        # ---------- HLS segments (.ts) — VOD fallback ----------
        # Served directly by nginx via sendfile (zero-copy, zero Python).
        # 200 users × 12 cameras × 1 segment/6s = ~400 req/s — trivial for nginx.
        location /hls/ {
            alias /data/videos/hls/;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t              ts;
            }

            add_header Cache-Control "public, max-age=86400, immutable";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Content-Type-Options nosniff;

            # Allow range requests for .ts segments.
            add_header Accept-Ranges bytes;
        }

        # ---------- Static assets (JS/CSS/HTML) ----------
        location /static/ {
            alias /app/app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ---------- API endpoints → gunicorn ----------
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # ---------- Progressive stream fallback → gunicorn ----------
        location /stream/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            proxy_buffering off;
        }

        # ---------- HTML pages (dashboard, camera) → gunicorn ----------
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ---------- Health check (bypass rate limit) ----------
        location = /healthz {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
